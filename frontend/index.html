<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chilla : gestion de projets agiles, simple et sereine." />
    <title>Chilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applique le thème avant le premier rendu (évite le flash blanc en mode sombre).
      try {
        var mode = localStorage.getItem('chilla_theme') || 'systeme'
        var sombre = mode === 'sombre' || (mode === 'systeme' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = sombre ? 'sombre' : 'clair'
      } catch (e) {
        document.documentElement.dataset.theme = 'clair'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
